name: Verify Next Milestone

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_devnet:
        description: Deploy the program and provision the common Devnet test mint
        type: boolean
        default: false
      test_mint:
        description: Existing test mint owned by the fee payer, or blank to create one
        type: string
        required: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            scripts/package-lock.json
            web/package-lock.json
      - name: Install Solana toolchain
        run: bash ci/install-solana.sh
      - name: Build the program and generate its IDL
        run: |
          anchor build
          node -e 'const fs = require("node:fs"); const canonical = path => JSON.stringify(JSON.parse(fs.readFileSync(path, "utf8"))); if (canonical("target/idl/next_milestone.json") !== canonical("web/public/devnet-idl.json")) throw new Error("Regenerate web/public/devnet-idl.json with anchor build")'
      - name: Test program rules and transfers
        run: |
          cargo test --workspace --locked
          npm ci --ignore-scripts --prefix scripts
          npm run check --prefix scripts
          npm run test:local --prefix scripts
      - name: Build the web app
        run: |
          npm ci --prefix web
          npm test --prefix web
          npm run build --prefix web
      - name: Deploy on Devnet and provision its token
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_devnet && github.ref == 'refs/heads/main'
        shell: bash
        env:
          DEVNET_PAYER_KEYPAIR: ${{ secrets.DEVNET_PAYER_KEYPAIR }}
          DEVNET_PROGRAM_KEYPAIR: ${{ secrets.DEVNET_PROGRAM_KEYPAIR }}
          TEST_MINT: ${{ inputs.test_mint }}
          DEVNET: https://api.devnet.solana.com
        run: |
          set -euo pipefail
          : "${DEVNET_PAYER_KEYPAIR:?Set the dedicated Devnet fee payer secret}"
          : "${DEVNET_PROGRAM_KEYPAIR:?Set the dedicated Devnet program keypair secret}"
          [[ "$(solana genesis-hash --url "$DEVNET")" == EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG ]]
          umask 077
          payer="$(mktemp)"
          program="$(mktemp)"
          buffer="$(mktemp)"
          trap 'rm -f "$payer" "$program" "$buffer"' EXIT
          printf '%s' "$DEVNET_PAYER_KEYPAIR" > "$payer"
          printf '%s' "$DEVNET_PROGRAM_KEYPAIR" > "$program"
          [[ "$(solana-keygen pubkey "$program")" == "$(node -p 'require("./target/idl/next_milestone.json").address')" ]]
          solana-keygen new --no-bip39-passphrase --silent --force --outfile "$buffer" >/dev/null
          solana program deploy --url "$DEVNET" --keypair "$payer" --program-id "$program" \
            --buffer "$buffer" target/deploy/next_milestone.so
          mint_args=()
          if [[ -n "$TEST_MINT" ]]; then mint_args+=(--mint "$TEST_MINT"); fi
          npm run provision:devnet --prefix scripts -- --wallet "$payer" "${mint_args[@]}"
